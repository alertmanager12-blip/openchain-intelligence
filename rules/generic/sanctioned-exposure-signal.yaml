apiVersion: openchain.io/rule/v1
id: sanctioned-exposure-signal
version: 1.1.1
name: Exposure to a sanctioned address (direct or indirect)
description: The detection engine reports direct or indirect (multi-hop) value exposure of a wallet to an address on a sanctions list (e.g. OFAC SDN).
author: openchain-community
enabled: true
tags: [generic, exposure, sanctions]
scope:
  eventTypes: [DETECTION_SIGNAL]
conditions:
  logic: AND
  rules:
    - field: signal.type
      operator: IN
      value: [SANCTIONED_EXPOSURE, INDIRECT_EXPOSURE]
    - field: signal.listed_category
      operator: EQUALS
      value: sanctioned
    - field: signal.confidence
      operator: GREATER_THAN_OR_EQUAL
      value: "0.5"
severity: HIGH
evidenceLevel: RISK_SIGNAL
cooldown: 6h
dedupKey: "{{rule.id}}:{{event.wallet.address}}"
expectedConfidence: 0.5
actions:
  - type: WEBHOOK
    connectorId: default-webhook
documentation: |
  Raises an alert when oci-intelligence emits a SANCTIONED_EXPOSURE (direct counterparty on a sanctions list) or an
  INDIRECT_EXPOSURE signal (value that reached the wallet through intermediaries) with a confidence of at least 0.5.
  Indirect exposure confidence decays with each hop (source reliability x 0.5^(hops-1)), so the 0.5 floor keeps
  direct exposure and 2-hop exposure to an authoritative list, and drops weaker, more distant paths.
  Only addresses a source lists as SANCTIONED count (signal.listed_category = sanctioned): before 1.1.0 an indirect
  exposure to any listed address (e.g. frozen by a stablecoin issuer) raised this alert; those now go to
  listed-address-exposure, worded and graded for what the source actually says.
  Exposure describes where funds came from; it is not a statement about the wallet owner. Propagation stops at
  exchanges and bridges (pooled funds). One alert per wallet per 6 hours.
translations:
  fr:
    name: "Exposition à une adresse sanctionnée (directe ou indirecte)"
    description: "Le moteur de détection signale une exposition directe ou indirecte (en plusieurs sauts) d'un portefeuille à une adresse figurant sur une liste de sanctions (p. ex. OFAC SDN)."
    documentation: |
      Lève une alerte quand oci-intelligence émet un signal SANCTIONED_EXPOSURE (contrepartie directe figurant sur une liste
      de sanctions) ou INDIRECT_EXPOSURE (valeur parvenue au portefeuille par des intermédiaires) avec une confiance d'au
      moins 0,5. La confiance d'une exposition indirecte décroît à chaque saut (fiabilité de la source x 0,5^(sauts-1)), si
      bien que le plancher de 0,5 conserve l'exposition directe et l'exposition à 2 sauts à une liste faisant autorité, et
      écarte les chemins plus faibles et plus lointains.
      Seules comptent les adresses qu'une source liste comme SANCTIONED (signal.listed_category = sanctioned) : avant la
      1.1.0, une exposition indirecte à n'importe quelle adresse listée (p. ex. gelée par l'émetteur d'un stablecoin) levait
      cette alerte ; ces cas relèvent désormais de listed-address-exposure, règle formulée et graduée selon ce que la source
      dit réellement.
      L'exposition décrit d'où viennent les fonds ; ce n'est pas une affirmation sur le propriétaire du portefeuille. La
      propagation s'arrête aux plateformes d'échange et aux bridges (fonds mutualisés). Une alerte par portefeuille toutes
      les 6 heures.
examples:
  - name: 2-hop exposure with confidence 0.5 matches
    expect: MATCH
    event:
      network: tron
      fields:
        signal.type: INDIRECT_EXPOSURE
        signal.listed_category: sanctioned
        signal.confidence: "0.5"
        wallet.address: TJDENsfBJs4RFETt1X1W8wMDc8M5XnJhCe
  - name: 3-hop exposure with confidence 0.25 does not match
    expect: NO_MATCH
    event:
      network: tron
      fields:
        signal.type: INDIRECT_EXPOSURE
        signal.listed_category: sanctioned
        signal.confidence: "0.25"
        wallet.address: TJDENsfBJs4RFETt1X1W8wMDc8M5XnJhCe
  - name: 2-hop exposure to an address frozen by a stablecoin issuer is not a sanctions exposure
    expect: NO_MATCH
    event:
      network: ethereum
      fields:
        signal.type: INDIRECT_EXPOSURE
        signal.listed_category: issuer-frozen
        signal.confidence: "0.5"
        wallet.address: "0xb69a051e6eb38f8e2b1d9f2bda5e1879f6e970e2"
  - name: other signal types do not match
    expect: NO_MATCH
    event:
      network: tron
      fields:
        signal.type: FAST_FORWARDING
        signal.confidence: "0.9"
tests:
  - name: repeated exposure signals for the same wallet are grouped
    events:
      - offset: 0s
        network: tron
        fields:
          signal.type: SANCTIONED_EXPOSURE
          signal.listed_category: sanctioned
          signal.confidence: "0.9"
          wallet.address: TJDENsfBJs4RFETt1X1W8wMDc8M5XnJhCe
      - offset: 10m
        network: tron
        fields:
          signal.type: INDIRECT_EXPOSURE
          signal.listed_category: sanctioned
          signal.confidence: "0.5"
          wallet.address: TJDENsfBJs4RFETt1X1W8wMDc8M5XnJhCe
    expectTriggers: 2
    expectAlerts: 1
