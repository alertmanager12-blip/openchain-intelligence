apiVersion: openchain.io/rule/v1
id: fund-splitting
version: 1.2.0
name: Fund splitting (more than 30 distinct recipients in 3 minutes)
description: One sender transfers meaningful amounts of known tokens to more than 30 distinct recipients within 3 minutes.
author: openchain-community
enabled: true
tags: [generic, peel-chain, splitting, structuring]
scope:
  eventTypes: [TOKEN_TRANSFER, NATIVE_TRANSFER]
conditions:
  logic: AND
  rules:
    - field: transaction.amount
      operator: GREATER_THAN
      value: "0"
  groups:
    # "not failed": an absent field never matches a leaf, so NOT(success == false) also accepts
    # events without success information, whereas success NOT_EQUALS false would reject them.
    - logic: NOT
      rules:
        - field: transaction.success
          operator: EQUALS
          value: false
    - logic: NOT
      rules:
        - field: transaction.token.symbol
          operator: EQUALS
          value: UNKNOWN
    - logic: NOT
      rules:
        - field: transaction.from
          operator: IN
          ignoreCase: true
          value: ["0x0000000000000000000000000000000000000000", "T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb"]
    - logic: OR
      groups:
        - logic: AND
          rules:
            - { field: transaction.token.symbol, operator: IN, value: [USDT, USDC, DAI] }
            - { field: transaction.amount, operator: GREATER_THAN_OR_EQUAL, value: "10" }
        - logic: AND
          rules:
            - { field: transaction.token.symbol, operator: IN, value: [ETH, WETH] }
            - { field: transaction.amount, operator: GREATER_THAN_OR_EQUAL, value: "0.005" }
        - logic: AND
          rules:
            - { field: transaction.token.symbol, operator: IN, value: [TRX] }
            - { field: transaction.amount, operator: GREATER_THAN_OR_EQUAL, value: "50" }
        - logic: AND
          rules:
            - { field: transaction.token.symbol, operator: IN, value: [BNB, WBNB, POL, MATIC] }
            - { field: transaction.amount, operator: GREATER_THAN_OR_EQUAL, value: "0.02" }
aggregation:
  window: { preset: 3m }
  groupBy: [transaction.from]
  function: DISTINCT_COUNT
  field: transaction.to
  operator: GREATER_THAN
  threshold: 30
severity: MEDIUM
evidenceLevel: ANOMALY
cooldown: 15m
expectedConfidence: 0.4
actions:
  - type: WEBHOOK
    connectorId: default-webhook
documentation: |
  1.2.0 (2026-11-09, measured on real Ethereum mainnet + TRON traffic): more than 30 distinct recipients within 3 minutes
  (was 10), each transfer above a minimum value (10 USDT/USDC/DAI, 0.005 ETH/WETH, 50 TRX, 0.02 BNB/POL), tokens unknown to
  the token registry (airdrop and address-poisoning spam) and mints (zero-address sender) excluded: 83% fewer alerts than
  1.1.0 on the same 261 s of real events. Chain-wide fan-out stays common on mainnet (exchanges, routers, payout wallets):
  scope it to your own watched wallets or exclude known services in your copy of the rule.
  Counts distinct recipients per sender in a 3-minute sliding window (event time). Rapid fan-out is a classic
  layering step ("splitting" / peel chains) but also matches payroll, airdrops and exchange hot-wallet payouts:
  consider excluding known payout wallets with a NOT group in a derived rule.
  Note: repeated payments to the same recipient count once.
examples:
  - name: successful USDT transfer above the minimum passes the filter
    expect: MATCH
    event:
      type: TOKEN_TRANSFER
      network: tron
      fields: { transaction.from: TSplitter111111111111111111111111, transaction.to: TRecipient1, transaction.amount: "1000", transaction.token.symbol: USDT, transaction.success: true }
  - name: failed transfer is ignored
    expect: NO_MATCH
    event:
      type: TOKEN_TRANSFER
      network: tron
      fields: { transaction.from: TSplitter111111111111111111111111, transaction.to: TRecipient1, transaction.amount: "1000", transaction.token.symbol: USDT, transaction.success: false }
  - name: dust (address-poisoning style) is ignored
    expect: NO_MATCH
    event:
      type: TOKEN_TRANSFER
      network: ethereum
      fields: { transaction.from: "0xspammer0000000000000000000000000000000001", transaction.to: "0xvictim0000000000000000000000000000000001", transaction.amount: "0.000001", transaction.token.symbol: USDT }
  - name: a token unknown to the registry is ignored
    expect: NO_MATCH
    event:
      type: TOKEN_TRANSFER
      network: ethereum
      fields: { transaction.from: "0xairdrop000000000000000000000000000000001", transaction.to: "0xholder00000000000000000000000000000000001", transaction.amount: "5000", transaction.token.symbol: UNKNOWN }
  - name: a mint (zero-address sender) is ignored
    expect: NO_MATCH
    event:
      type: TOKEN_TRANSFER
      network: ethereum
      fields: { transaction.from: "0x0000000000000000000000000000000000000000", transaction.to: "0xholder00000000000000000000000000000000001", transaction.amount: "5000", transaction.token.symbol: USDC }
tests:
  - name: 31 distinct recipients in 155 seconds triggers
    events:
      - repeat: 31
        every: 5s
        type: TOKEN_TRANSFER
        network: tron
        fields: { transaction.from: TSplitter111111111111111111111111, transaction.to: "TRecipient{{i}}", transaction.amount: "1000", transaction.token.symbol: USDT }
    expectTriggers: 1
  - name: 30 distinct recipients do not trigger (more than 30 required)
    events:
      - repeat: 30
        every: 5s
        type: TOKEN_TRANSFER
        network: tron
        fields: { transaction.from: TSplitter111111111111111111111111, transaction.to: "TRecipient{{i}}", transaction.amount: "1000", transaction.token.symbol: USDT }
    expectTriggers: 0
  - name: 40 payments to the same recipient do not trigger
    events:
      - repeat: 40
        every: 3s
        type: TOKEN_TRANSFER
        network: tron
        fields: { transaction.from: TSplitter111111111111111111111111, transaction.to: TRecipientA, transaction.amount: "1000", transaction.token.symbol: USDT }
    expectTriggers: 0
  - name: 31 recipients spread over 10 minutes do not trigger
    events:
      - repeat: 31
        every: 20s
        type: TOKEN_TRANSFER
        network: tron
        fields: { transaction.from: TSplitter111111111111111111111111, transaction.to: "TRecipient{{i}}", transaction.amount: "1000", transaction.token.symbol: USDT }
    expectTriggers: 0
