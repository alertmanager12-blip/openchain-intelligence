name: Dependency review

# Blocks pull requests that add a dependency with a known vulnerability of high or critical severity.
# Licences are checked by the "Dependency licence policy" job of ci.yml (ADR-0012).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
