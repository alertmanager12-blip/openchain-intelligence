name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push cancels the run of a branch or pull request, never a run on main: every commit of main keeps its result
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Maven, JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: No skipped test
        # the PostgreSQL integration tests skip themselves without Docker; in CI Docker is there, so a skipped test means
        # that a restart or persistence test silently did not run (phase 1 exit criterion: "Skipped: 0")
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' $(find . -path '*/target/surefire-reports/TEST-*.xml') | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "skipped tests: ${skipped:-0}"
          if [ "${skipped:-0}" -ne 0 ]; then
            grep -l 'skipped="[1-9]' $(find . -path '*/target/surefire-reports/TEST-*.xml')
            echo "::error::${skipped} test(s) skipped"; exit 1
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -- --configuration production
      - name: Unit tests (headless)
        run: npm test -- --watch=false
        env:
          CI: "true"

  license-check:
    name: Dependency licence policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Enforces ADR-0012: the job fails on any runtime dependency without an allowed licence.
      - name: Maven third-party licences
        run: |
          mvn -B -ntp -q org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-add-third-party -Dlicense.excludedScopes=test,provided
          python3 .github/scripts/check-maven-licences.py target/generated-sources/license/THIRD-PARTY.txt
      - name: npm licences
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          # ADR-0012 amendment 1: OFL-1.1 is allowed for these font packages only; everything else uses the base allowlist.
          FONT_PACKAGES="@fontsource-variable/ibm-plex-sans@5.3.0;@fontsource/ibm-plex-mono@5.3.0"
          npx --no-install license-checker-rseidelsohn --production --summary --excludePrivatePackages --excludePackages "$FONT_PACKAGES" \
            --onlyAllow "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0;Unlicense"
          npx --no-install license-checker-rseidelsohn --production --summary --includePackages "$FONT_PACKAGES" --onlyAllow "OFL-1.1"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate compose file
        run: docker compose -f docker-compose.yml --profile observability config -q
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: openchain-intelligence/app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: false
          tags: openchain-intelligence/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Compose smoke test (start, end-to-end demo checks, stop)
        run: bash deploy/smoke-test.sh

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build (Java)
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
