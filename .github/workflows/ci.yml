name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven, JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build -- --configuration production
      - name: Unit tests (headless)
        run: npm test -- --watch=false
        env:
          CI: "true"

  license-check:
    name: Dependency licence policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Enforces ADR-0012: the job fails on any runtime dependency without an allowed licence.
      - name: Maven third-party licences
        run: |
          mvn -B -ntp -q org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-add-third-party -Dlicense.excludedScopes=test,provided
          python3 .github/scripts/check-maven-licences.py target/generated-sources/license/THIRD-PARTY.txt
      - name: npm licences
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          # ADR-0012 amendment 1: OFL-1.1 is allowed for these font packages only; everything else uses the base allowlist.
          FONT_PACKAGES="@fontsource-variable/inter@5.3.0;@fontsource/jetbrains-mono@5.3.0"
          npx --yes license-checker-rseidelsohn@4 --production --summary --excludePrivatePackages --excludePackages "$FONT_PACKAGES" \
            --onlyAllow "Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0;Unlicense"
          npx --yes license-checker-rseidelsohn@4 --production --summary --includePackages "$FONT_PACKAGES" --onlyAllow "OFL-1.1"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate compose file
        run: docker compose -f docker-compose.yml --profile observability config -q
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: openchain-intelligence/app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: false
          tags: openchain-intelligence/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Compose smoke test (start, end-to-end demo checks, stop)
        run: bash deploy/smoke-test.sh

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build (Java)
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
