name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: Who needs this and why? What do you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal keeps detection explainable and does not label addresses as criminal
          required: true
        - label: The proposal does not require executing user-supplied code
          required: true
