name: Bug report
description: Something does not work as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Security vulnerabilities must NOT be reported here — see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Observed vs. expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. docker compose up\n2. POST /api/v1/rules ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [indexing / providers, detection / scoring, rule engine / alerts, notifications, API, frontend, deployment, docs]
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [n/a, tron, ethereum, bsc, polygon, demo simulator]
  - type: textarea
    id: logs
    attributes:
      label: Logs / traces
      description: Redact API keys, secrets and personal data.
      render: text
