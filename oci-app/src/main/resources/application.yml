spring:
  application:
    name: openchain-intelligence
  main:
    banner-mode: off
  mvc:
    problemdetails:
      # our GlobalExceptionHandler (a ResponseEntityExceptionHandler) renders every error in the contract format
      enabled: false
  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: OpenChain Intelligence
    version: 0.1.0-SNAPSHOT

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

oci:
  demo:
    # OCI_DEMO_MODE=true: simulated TRON + Ethereum chains, fictional labels, a generated admin key (logged once).
    enabled: ${OCI_DEMO_MODE:false}
    networks: [tron, ethereum]
    seed-minutes: 60
    live: true
    seed: 42
    address-pool-size: 40
    max-transfers-per-block: 3
    api-key: ${OCI_DEMO_API_KEY:}
  rules:
    # first existing directory wins (repo root when run from the root, ../rules when run from oci-app/)
    directories: ${OCI_RULES_DIRS:rules,../rules}
    load-on-startup: true
    max-dry-run-events: 50000
  labels:
    files: []
  ingestion:
    poll-interval: 5s
    dispatch-interval: 2s
    event-history-size: 100000
  security:
    # Required with PostgreSQL persistence (outside demo mode): openssl rand -base64 48. Changing it invalidates all API keys.
    api-key-pepper: ${OCI_SECURITY_API_KEY_PEPPER:}
    # AES-256-GCM key for connector secrets at rest (base64 of 32 bytes: openssl rand -base64 32). Required with PostgreSQL.
    crypto-master-key: ${OCI_CRYPTO_MASTER_KEY:}
    key-environment: live
    default-key-ttl: 90d
    max-key-ttl: 365d
    cors-allowed-origins: ${OCI_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    oidc:
      # JWT resource server is configured only when set (lazy discovery: no IdP call at startup)
      issuer-uri: ${OCI_SECURITY_OIDC_ISSUER_URI:}
      audience: ${OCI_SECURITY_OIDC_AUDIENCE:}
      roles-claim: oci_roles
  # Real providers (off by default). Example:
  # chains:
  #   tron:     { enabled: true, provider: trongrid, url: https://api.trongrid.io, api-key-header: TRON-PRO-API-KEY, api-key: ${TRONGRID_API_KEY} }
  #   ethereum: { enabled: true, provider: json-rpc, url: https://your-rpc.example, start-block: -100 }
  # approvals-of-unknown-tokens: true also ingests APPROVAL events of tokens absent from the token registry (default false)
  # watched-contracts: [0x...] adds contracts whose OwnershipTransferred / EIP-1967 Upgraded / AdminChanged logs become
  #   CONTRACT_ADMIN_CHANGE events (token registry contracts are always watched); admin-changes-of-all-contracts: true = all
  # freeze-backfill: { from-block: 19000000 }  bounded historical scan of issuer freeze events (disabled when from-block is
  #   unset; to-block default = finalized head, chunk-size 2000, min-chunk-size 10, pause 250ms, run-on-startup true);
  #   also POST /api/v1/admin/backfill/freezes (keys:admin). Progress is persisted in PostgreSQL mode.
  # Operator state (API keys, connectors, rules, alerts, deliveries, label reports, users) is stored in PostgreSQL when
  # SPRING_DATASOURCE_URL (spring.datasource.url) is set - schema migrated by Flyway at startup - and in memory otherwise.
  persistence:
    delivery-claim-lease: 2m
  notifications:
    # Public URL of the console, for links in notifications (Telegram). Unset = no console link.
    public-url: ${OCI_PUBLIC_URL:}
    telegram:
      # Bot token used by TELEGRAM connectors (destination chat id is given per connector). Unset = channel disabled.
      bot-token: ${OCI_TELEGRAM_BOT_TOKEN:}
  chains: {}

logging:
  level:
    oci.audit: INFO
